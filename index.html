<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ottom — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #fffaf5;
            color: #171717;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
        }

        .logo {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -3px;
            color: #f47b20;
            margin-bottom: 45px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #777;
            max-width: 450px;
            margin: auto;
        }

        .line {
            width: 55px;
            height: 4px;
            background: #f47b20;
            border-radius: 10px;
            margin: 30px auto;
        }

        .footer {
            margin-top: 70px;
            font-size: 13px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 44px;
            }

            h1 {
                letter-spacing: -2px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">ottom</div>
        <h1>Coming Soon.</h1>
        <div class="line"></div>
        <p>
            Something simple. Something better.<br>
            We're getting things ready.
        </p>
        <div class="footer">
            © 2026 Ottom
        </div>
    </div>
</body>
</html>
